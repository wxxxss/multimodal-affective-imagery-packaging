name: reproducibility-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install numpy==1.26.4 scikit-learn==1.9.0 'pytest>=8,<10'
      - name: Run publication-facing tests
        run: pytest -q tests/test_public_heldout_evaluation.py
